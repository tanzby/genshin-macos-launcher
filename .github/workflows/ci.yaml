name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a PR supersedes its running check; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Swift test and app build
        run: scripts/dev/macos-check
