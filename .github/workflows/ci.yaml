name: CI
on:
  pull_request:
jobs:
  swift:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        target: [LauncherClientHandoffTests, APP_020_AutoLaunchTests, LauncherTests/, ALL]
    steps:
      - uses: actions/checkout@v4
      - name: hunt
        run: |
          swift build --build-tests > /dev/null 2>&1
          crashes=0
          for n in 1 2 3 4 5 6; do
            if [ "${{ matrix.target }}" = ALL ]; then f=""; else f="--filter ${{ matrix.target }}"; fi
            if ! swift test --skip-build $f > run.log 2>&1; then crashes=$((crashes+1)); tail -2 run.log | cut -c1-160; fi
          done
          echo "CRASHES target=${{ matrix.target }}: $crashes of 8"
          [ "$crashes" = 0 ]
