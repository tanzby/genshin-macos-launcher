name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  swift:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Swift test and app build
        run: scripts/dev/macos-check

      - name: Checkout is still clean
        run: test -z "$(git status --porcelain)" || { git status; git diff; exit 1; }
