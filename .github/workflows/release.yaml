name: Release

# A semver tag (1.0.0-rc.1, 1.0.0, ...) builds the app and publishes a regular
# release with GenshinLauncher-<ver>.dmg (for people and as the Sparkle enclosure) and appcast.xml.
# It stays a dry run (artifacts only, nothing published) until the secret
# SPARKLE_ED_PRIVATE_KEY exists and SUPublicEDKey is set in project.yml.
# Run it by hand from the Actions tab to dry-run on any branch.

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+", "[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, as if tagged (dry run, never publishes)
        default: 0.0.0-dryrun
        required: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  SPARKLE_VERSION: 2.10.0
  SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c

jobs:
  dxmt:
    uses: ./.github/workflows/dxmt.yaml

  release:
    needs: dxmt
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Apple's GPTK 4.0b3 redist cannot be downloaded on a runner. A maintainer packs the payload staged by
      # scripts/prepare-gptk4 (`tar -C build -cJf gptk4-4.0b3.tar.xz gptk4`) into the prerelease below; the pinned
      # hash keeps the release on exactly that payload.
      - name: Download GPTK4
        env:
          GH_TOKEN: ${{ github.token }}
          GPTK4_RELEASE: gptk4-payload-4.0b3
          GPTK4_SHA256: f595b4e3876be84b76100790add403224b1e6f4668f263dbc2c8038f1b4673fc
        run: |
          set -eu
          gh release download "$GPTK4_RELEASE" --pattern gptk4-4.0b3.tar.xz --dir "$RUNNER_TEMP"
          echo "$GPTK4_SHA256  $RUNNER_TEMP/gptk4-4.0b3.tar.xz" | shasum -a 256 -c -
          mkdir -p build
          tar -C build -xJf "$RUNNER_TEMP/gptk4-4.0b3.tar.xz"
          scripts/dev/check-gptk4 build/gptk4

      # Built by dxmt.yaml; project.yml puts build/dxmt into Contents/Resources/dxmt.
      - name: Download DXMT
        uses: actions/download-artifact@v4
        with:
          name: dxmt
          path: build/dxmt

      - name: Resolve version and mode
        env:
          HAS_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            version="$INPUT_VERSION"
          fi
          echo "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$' \
            || { echo "::error::'$version' is not a semver version"; exit 1; }

          publish=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # Releases come from main only.
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || { echo "::error::tag $version is not on main"; exit 1; }
            if [ "$HAS_KEY" != true ]; then
              echo "::warning::SPARKLE_ED_PRIVATE_KEY is not set; dry run, nothing is published"
            else
              publish=true
            fi
          fi
          # CFBundleVersion: a plain, monotonically increasing integer. Sparkle
          # compares it, so the rc -> final ordering never depends on the tag.
          build=$GITHUB_RUN_NUMBER
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD=$build" >> "$GITHUB_ENV"
          echo "PUBLISH=$publish" >> "$GITHUB_ENV"
          echo "version=$version build=$build publish=$publish"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Parity coverage (strict for final versions)
        run: |
          # Release candidates (x.y.z-rc.N) only report; a final version needs
          # every 照搬/改写 rule covered (docs/parity/hk4e-cn.md, gate 2).
          case "$VERSION" in
            *-*) scripts/dev/parity-coverage ;;
            *) scripts/dev/parity-coverage --strict ;;
          esac

      - name: Swift test
        run: swift test

      - name: Build app
        run: |
          set -eu
          xcodegen generate
          xcodebuild -project GenshinLauncher.xcodeproj -scheme GenshinLauncher -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/DerivedData \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" build
          app="build/DerivedData/Build/Products/Release/Genshin Launcher.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          REQUIRE_DXMT=1 REQUIRE_GPTK4=1 scripts/dev/check-bundle "$app"
          plist="$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$BUILD"
          /usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$plist"
          # The built plist, not project.yml text, decides whether publishing is safe.
          ed_key=$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$plist")
          echo "ED_PUBLIC_KEY=$ed_key" >> "$GITHUB_ENV"
          if [ "$PUBLISH" = true ] && [ -z "$ed_key" ]; then
            echo "::warning::SUPublicEDKey is empty in the built app; dry run, nothing is published"
            echo "PUBLISH=false" >> "$GITHUB_ENV"
          fi
          lipo -archs "$app/Contents/MacOS/Genshin Launcher"
          echo "APP=$PWD/$app" >> "$GITHUB_ENV"

      - name: Package dmg
        run: |
          set -eu
          mkdir -p dist
          scripts/release/make-dmg "$APP" "dist/GenshinLauncher-$VERSION.dmg"
          ls -l dist

      - name: Generate appcast
        if: env.PUBLISH == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle" ./bin
          # The private key goes in through stdin only, never to disk or argv.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/" \
            -o dist/appcast.xml dist
          grep -q 'sparkle:edSignature' dist/appcast.xml \
            || { echo "::error::appcast has no EdDSA signature"; exit 1; }
          grep -q "<sparkle:shortVersionString>$VERSION<" dist/appcast.xml \
            || { echo "::error::appcast does not list $VERSION"; exit 1; }
          # The secret must pair with the SUPublicEDKey built into the app, or every
          # client would reject this update. Check before anything is published.
          sig=$(grep -o 'sparkle:edSignature="[^"]*"' dist/appcast.xml | head -1 | cut -d'"' -f2)
          swift scripts/release/verify-ed-signature.swift "$ED_PUBLIC_KEY" "$sig" "dist/GenshinLauncher-$VERSION.dmg" \
            || { echo "::error::SPARKLE_ED_PRIVATE_KEY does not match SUPublicEDKey"; exit 1; }
          cat dist/appcast.xml

      - name: Upload build artifacts (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GenshinLauncher-${{ env.VERSION }}
          path: dist
          retention-days: 7

      - name: Publish release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$VERSION" --verify-tag --title "$VERSION" --generate-notes --notes-file scripts/release/dmg-install.txt \
            "dist/GenshinLauncher-$VERSION.dmg" dist/appcast.xml
