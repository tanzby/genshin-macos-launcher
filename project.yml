name: GenshinLauncher
options:
  bundleIdPrefix: io.github.tanzby
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
packages:
  GenshinLauncherKit:
    path: .
targets:
  GenshinLauncher:
    type: application
    platform: macOS
    sources:
      - path: App
      # Windows PE files copied into the Wine prefix for the Steam patch (see THIRD_PARTY_NOTICES.md).
      - path: Resources/protonextras
        type: folder
        buildPhase: resources
    # DXMT built by scripts/build-dxmt (docs/adr/0003) goes into Contents/Resources/dxmt. A folder source would
    # fail the build when the folder is absent, which it is in builds that did not run the script. Xcode does not
    # re-sign for a change made here, so after the first scripts/build-dxmt delete the built app once.
    postCompileScripts:
      - name: Bundle DXMT
        basedOnDependencyAnalysis: false
        script: |
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/dxmt"
          rm -rf "$dest"
          if [ -d "$SRCROOT/build/dxmt" ]; then
            ditto "$SRCROOT/build/dxmt" "$dest"
          fi
      - name: Bundle GPTK4
        basedOnDependencyAnalysis: false
        script: |
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/gptk4"
          rm -rf "$dest"
          if [ -d "$SRCROOT/build/gptk4" ]; then
            ditto "$SRCROOT/build/gptk4" "$dest"
          fi
    info:
      path: build/Info.plist
      properties:
        SUFeedURL: https://github.com/tanzby/genshin-macos-launcher/releases/latest/download/appcast.xml
        # EdDSA public key printed by generate_keys (private key: login Keychain + CI secret SPARKLE_ED_PRIVATE_KEY).
        SUPublicEDKey: "+bZH7ivQ9Rt952S3q3X8nYfrOCYGNA8V/5VrW1Cavkc="
        # Check on its own once a day without Sparkle's first-launch permission prompt;
        # the Settings toggle overrides this through the user defaults.
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # Without it Finder, Spotlight and Launchpad show the file name, not the localized display name.
        # An INFOPLIST_KEY_LSHasLocalizedDisplayName build setting is silently dropped, so it is set here.
        LSHasLocalizedDisplayName: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tanzby.genshin-launcher
        PRODUCT_NAME: Genshin Launcher
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_CFBundleDisplayName: Genshin Launcher
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_LSMinimumSystemVersion: "26.0"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        MARKETING_VERSION: 0.0.0
        CURRENT_PROJECT_VERSION: 1
    dependencies:
      - package: GenshinLauncherKit
        product: Launcher
      - package: GenshinLauncherKit
        product: GenshinCN
      - package: GenshinLauncherKit
        product: Platform
      - package: GenshinLauncherKit
        product: Wine
      - package: GenshinLauncherKit
        product: Updates
      - package: GenshinLauncherKit
        product: Diagnostics
      - target: GenshinLauncherWineShim
        embed: true
        link: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: GenshinLauncherGameHost
        embed: true
        link: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers

  # x86_64 helpers injected into Wine (Rosetta). Sources are the C files in Helpers/.
  GenshinLauncherWineShim:
    type: tool
    platform: macOS
    sources:
      - path: Helpers/wine-shim.c
    settings:
      base:
        PRODUCT_NAME: genshin-launcher-wine-shim
        ARCHS: x86_64
        ONLY_ACTIVE_ARCH: NO
        GCC_OPTIMIZATION_LEVEL: "2"
        OTHER_CFLAGS: -Wall -Wextra
        SKIP_INSTALL: YES

  GenshinLauncherGameHost:
    type: library.dynamic
    platform: macOS
    sources:
      - path: Helpers/gamehost.c
    settings:
      base:
        PRODUCT_NAME: genshin-launcher-gamehost
        EXECUTABLE_PREFIX: ""
        ARCHS: x86_64
        ONLY_ACTIVE_ARCH: NO
        GCC_OPTIMIZATION_LEVEL: "2"
        OTHER_CFLAGS: -Wall -Wextra
        SKIP_INSTALL: YES

schemes:
  GenshinLauncher:
    build:
      targets:
        GenshinLauncher: all
    run:
      config: Debug
